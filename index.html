<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="google" value="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta name="robots" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#153d2c" />
    <meta name="description" content="Agricultural, bioresource and rural economic decision intelligence." />
    <title>Agri-Economic Intelligence</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) { caches.delete(k); }
        });
      }
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var r = document.getElementById('root');
        if (r && (!r.childNodes || r.childNodes.length === 0)) {
          r.innerHTML = '<div style="padding:24px;font-family:sans-serif;background:#fff2f0;border:1px solid #ffccc7;margin:24px;border-radius:8px;color:#a8071a;">' +
            '<h3>Application Loading Notice</h3><p>' + (e.message || 'Error loading module') + '</p>' +
            '<button style="padding:8px 16px;background:#236341;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="location.reload()">Reload</button></div>';
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
